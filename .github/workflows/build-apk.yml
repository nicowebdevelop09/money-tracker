name: Build APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa dipendenze e compila l'app web
        run: |
          npm install
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepara ed esegui il sync di Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Estrai chiave di firma fissa
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/android/app/debug.keystore
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Chiave fissa ripristinata con successo!"
          else
            echo "::warning::Nessun secret DEBUG_KEYSTORE_BASE64 impostato!"
          fi

      - name: Compila l'APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug.keystore
        run: ./gradlew assembleDebug -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v6
        with:
          name: money-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk