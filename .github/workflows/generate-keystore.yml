name: Generate signing key (esegui una sola volta)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Genera keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Money Tracker, O=Personal, C=IT"
          base64 -w0 debug.keystore > debug.keystore.base64
          echo "--- Copia tutto il contenuto sotto questa riga, senza spazi né a capo, e incollalo come nuovo secret ---"
          cat debug.keystore.base64

      - name: Carica come artifact (backup)
        uses: actions/upload-artifact@v6
        with:
          name: signing-key
          path: |
            debug.keystore
            debug.keystore.base64