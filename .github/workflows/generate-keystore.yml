name: Generate Keystore

# Da eseguire UNA SOLA VOLTA. Genera una chiave di firma Android fissa e la carica
# come artifact scaricabile. Il contenuto base64 va poi salvato come secret
# DEBUG_KEYSTORE_BASE64 nelle impostazioni del repository (Settings → Secrets and
# variables → Actions → New repository secret).
#
# Questa chiave fissa è ciò che permette a ogni build futura di avere la stessa
# firma, così puoi installare gli aggiornamenti SOPRA l'app esistente senza perdere
# i dati salvati.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore money-tracker.keystore \
            -alias money-tracker \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass moneytracker123 \
            -keypass moneytracker123 \
            -dname "CN=Money Tracker, OU=Personal, O=Personal, L=Como, ST=Italy, C=IT"

      - name: Encode keystore to base64
        run: base64 -w 0 money-tracker.keystore > money-tracker.keystore.base64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-tracker-keystore
          path: |
            money-tracker.keystore
            money-tracker.keystore.base64
          retention-days: 90

      - name: Print instructions
        run: |
          echo "=================================================="
          echo "Keystore generato con successo."
          echo "1. Scarica l'artifact 'money-tracker-keystore'"
          echo "2. Apri il file money-tracker.keystore.base64"
          echo "3. Copia tutto il contenuto (una sola riga lunga)"
          echo "4. Vai su Settings > Secrets and variables > Actions"
          echo "5. Crea un nuovo secret chiamato DEBUG_KEYSTORE_BASE64"
          echo "6. Incolla il contenuto copiato come valore"
          echo "=================================================="
